<div class="page">
  <app-sidebar [lang]="currentLang" (langChange)="switchLang($event)"></app-sidebar>

  <main class="content">
    <h1 class="page-title">{{ title }}</h1>

    <div class="collage-wrap" [class.with-text]="currentPage === 1">
      <img src="assets/collage.jpg" alt="SOROKA collage" class="collage-img" />

      @if (currentPage === 1) {
        <div class="text-overlay">
          @for (line of lines; track $index) {
            <p class="line">{{ line }}</p>
          }
        </div>
      }
    </div>

    <div class="page-switcher">
      <button class="page-btn" [class.active]="currentPage === 0" (click)="goToPage(0)">1</button>
      <button class="page-btn" [class.active]="currentPage === 1" (click)="goToPage(1)">2</button>
    </div>
  </main>
</div>
