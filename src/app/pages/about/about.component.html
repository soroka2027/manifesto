<div class="page">
  <app-sidebar [lang]="currentLang" (langChange)="switchLang($event)"></app-sidebar>

  <main class="content">
    <h1 class="page-title">{{ title }}</h1>

    <div class="about-body">
      <div class="collage-wrap">
        <img src="assets/collage.jpg" alt="SOROKA collage" class="collage-img" />
      </div>

      <div class="bio-text">
        @for (line of lines; track $index) {
          <p class="line">{{ line }}</p>
        }
      </div>
    </div>
  </main>
</div>
