<div class="page">
  <app-sidebar [lang]="currentLang" (langChange)="switchLang($event)"></app-sidebar>

  <main class="content">
    <div class="text-block">
      <p class="lead">{{ t.p1 }}</p>
      <p>{{ t.p2 }}</p>
      <p class="mt">{{ t.p3 }}</p>
      <p class="quote-line">{{ t.p4 }}</p>
      <p class="mt">{{ t.p5 }}</p>
      <p>{{ t.p6 }}</p>
      <p class="mt">{{ t.p7 }}</p>
      <a [routerLink]="['/manifest']" class="manifest-title">{{ t.title }}</a>
      <p class="mt">{{ t.p8 }}</p>
      <p>{{ t.p9 }}</p>
      <p class="call-to-action">{{ t.p10 }}</p>
    </div>
  </main>
</div>
