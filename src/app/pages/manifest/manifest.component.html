<div class="page">
  <app-sidebar [lang]="currentLang" (langChange)="switchLang($event)"></app-sidebar>

  <main class="content">
    <h1 class="page-title">{{ title }}</h1>

    <div class="text-block">
      @for (p of paragraphs; track $index) {
        <p [class.quote]="$index === 4 && currentPage === 0"
           [class.strong]="$index >= paragraphs.length - 3 && currentPage === pages.length - 1">
          {{ p }}
        </p>
      }
    </div>

    <div class="page-switcher">
      @for (pg of pages; track $index) {
        <button
          class="page-btn"
          [class.active]="currentPage === $index"
          (click)="goToPage($index)">
          {{ $index + 1 }}
        </button>
      }
    </div>
  </main>
</div>
