<div class="page">
  <app-sidebar [lang]="currentLang" (langChange)="switchLang($event)"></app-sidebar>

  <main class="content">
    <h1 class="page-title">{{ title }}</h1>

    <div class="text-block">
      @for (p of paragraphs; track $index) {
        <p>{{ p }}</p>
      }
    </div>

    <div class="page-switcher">
      @for (i of pageIndexes; track i) {
        <button
          class="page-btn"
          [class.active]="currentPage === i"
          (click)="goToPage(i)">
          {{ i + 1 }}
        </button>
      }
    </div>
  </main>
</div>
