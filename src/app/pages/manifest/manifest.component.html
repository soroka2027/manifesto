<div class="page">
  <app-sidebar [lang]="currentLang" (langChange)="switchLang($event)"></app-sidebar>

  <main class="content">
    <h1 class="page-title">{{ title }}</h1>

    <div class="text-block">
      @for (p of paragraphs; track $index) {
        <p>{{ p }}</p>
      }
    </div>

    <div class="page-switcher">
      <button class="nav-btn" (click)="prev()" [disabled]="currentPage === 0" aria-label="Previous">«</button>

      @for (item of visiblePages; track $index) {
        @if (item === 'ellipsis') {
          <span class="ellipsis">…</span>
        } @else {
          <button
            class="page-btn"
            [class.active]="currentPage === item"
            (click)="goToPage(item)">
            {{ item + 1 }}
          </button>
        }
      }

      <button class="nav-btn" (click)="next()" [disabled]="currentPage === totalPages - 1" aria-label="Next">»</button>
    </div>
  </main>
</div>
